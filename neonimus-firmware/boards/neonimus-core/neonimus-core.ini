; PlatformIO Project Configuration File - Neonimus Firmware
; Board: neonimus-core (ESP32-S3-DevKitC-1 N16R8 + 1.8" ST7735 + SD + INMP441 + MAX98357A)
;
; This file is picked up automatically by upstream's
;   extra_configs = boards/*.ini boards/*/*.ini
; mechanism - no edits to the upstream platformio.ini are needed.

[env:neonimus-core]
board = neonimus-core
board_build.partitions = partitions/neonimus_16mb_ota.csv
board_build.arduino.memory_type = qio_opi ; required for N16R8 octal PSRAM
board_upload.flash_size = 16MB
board_build.f_flash = 40000000L

build_src_filter =
	${env.build_src_filter}
	+<../boards/neonimus-core>
	+<../branding>

build_flags =
	${env.build_flags}
	-Iboards/neonimus-core
	-Ibranding
	-include neonimus_config.h
	-DBOARD_HAS_PSRAM=1
	-DCORE_DEBUG_LEVEL=1
	-DDEVICE_NAME='"Neonimus"'

	; --- Phase 1 baseline: WiFi/BLE toolset only ---
	; --- Phase 6 optional modules - uncomment as hardware is added ---
	;-DNEONIMUS_HAS_CC1101=1
	;-DNEONIMUS_HAS_PN532=1
	;-DNEONIMUS_HAS_IR=1
	;-DNEONIMUS_HAS_NRF24=1
	;-DNEONIMUS_HAS_GPS=1
	;-DALLOW_ALL_GPIO_FOR_IR_RF=1

lib_deps =
	${env.lib_deps}

; Second env: same hardware, debug build (verbose serial logging, no -Os)
[env:neonimus-core-debug]
extends = env:neonimus-core
build_flags =
	${env:neonimus-core.build_flags}
	-DCORE_DEBUG_LEVEL=5
	-UNDEBUG
